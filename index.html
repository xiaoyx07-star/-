<div id="app">
  <div class="loading-screen">Firebaseに接続しています...</div>

<script>
(function(){
  "use strict";

  var state = {
    view: "list",
    loading: true,
    error: null,
    index: [],
    currentId: null,
    currentSite: null,
    showAddModal: false,
    showEditAddr: false,
    lightboxPhotoId: null,
    toast: null,
    savingPhoto: false
  };

  var siteCache = {};
  var app = document.getElementById("app");

  function waitForFirebase(){
    return new Promise(function(resolve){
      if(window.firebaseDB && window.firebaseFns){
        resolve();
        return;
      }

      window.addEventListener("firebase-ready", function(){
        resolve();
      }, {once:true});
    });
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
      }[c];
    });
  }

  function showToast(msg){
    state.toast = msg;
    render();

    setTimeout(function(){
      state.toast = null;
      render();
    },1800);
  }

  /* =========================
     Firebase Firestore
     ========================= */

  async function loadIndex(){
    state.loading = true;
    render();

    try{
      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var q = f.query(
        f.collection(db, "sites"),
        f.orderBy("createdAt", "desc")
      );

      var snapshot = await f.getDocs(q);

      var list = [];

      snapshot.forEach(function(d){
        var data = d.data();

        list.push({
          id:d.id,
          name:data.name || "",
          address:data.address || "",
          client:data.client || "",
          createdAt:data.createdAt || Date.now()
        });
      });

      state.index = list;
      state.error = null;

    }catch(e){

      console.error(e);

      state.index = [];

      state.error =
        "Firebaseからデータを読み込めませんでした。Firestoreのルールを確認してください。";
    }

    state.loading = false;
    render();
  }

  async function openSite(id){

    state.currentId = id;
    state.view = "detail";

    if(siteCache[id]){
      state.currentSite = siteCache[id];
      render();
    }else{
      state.currentSite = null;
      render();
    }

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var siteRef = f.doc(db,"sites",id);
      var siteSnap = await f.getDoc(siteRef);

      if(!siteSnap.exists()){

        var meta = state.index.find(function(s){
          return s.id === id;
        });

        state.currentSite = meta || {
          id:id,
          name:"",
          address:"",
          client:"",
          photos:[],
          comments:[]
        };

      }else{

        var data = siteSnap.data();

        state.currentSite = {
          id:id,
          name:data.name || "",
          address:data.address || "",
          client:data.client || "",
          createdAt:data.createdAt || Date.now(),
          photos:data.photos || [],
          comments:data.comments || []
        };
      }

      siteCache[id] = state.currentSite;

      if(state.currentId === id){
        render();
      }

    }catch(e){

      console.error(e);

      state.error =
        "現場データの読み込みに失敗しました。";

      render();
    }
  }

  function backToList(){

    state.view = "list";
    state.currentId = null;
    state.currentSite = null;
    state.lightboxPhotoId = null;

    render();
  }

  async function addSite(name,address,client){

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var site = {
        name:name,
        address:address,
        client:client,
        createdAt:Date.now(),
        photos:[],
        comments:[]
      };

      var ref = await f.addDoc(
        f.collection(db,"sites"),
        site
      );

      var entry = {
        id:ref.id,
        name:name,
        address:address,
        client:client,
        createdAt:site.createdAt
      };

      state.index.push(entry);

      state.showAddModal = false;

      siteCache[ref.id] = {
        id:ref.id,
        name:name,
        address:address,
        client:client,
        createdAt:site.createdAt,
        photos:[],
        comments:[]
      };

      render();

      openSite(ref.id);

    }catch(e){

      console.error(e);

      state.error =
        "現場の保存に失敗しました。FirebaseのFirestore設定を確認してください。";

      render();
    }
  }

  async function updateSiteInfo(id,address,client){

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var ref = f.doc(db,"sites",id);

      await f.updateDoc(ref,{
        address:address,
        client:client
      });

      var newIndex = state.index.map(function(s){

        return s.id === id
          ? Object.assign({},s,{
              address:address,
              client:client
            })
          : s;
      });

      state.index = newIndex;

      var newSite = Object.assign({},state.currentSite,{
        address:address,
        client:client
      });

      state.currentSite = newSite;
      siteCache[id] = newSite;

      state.showEditAddr = false;

      render();

      showToast("現場情報を更新しました");

    }catch(e){

      console.error(e);

      state.error =
        "現場情報の更新に失敗しました。";

      render();
    }
  }

  async function deleteSite(id){

    if(!confirm(
      "この現場を削除しますか？\n現場情報・コメント・写真も削除されます。"
    )){
      return;
    }

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      await f.deleteDoc(
        f.doc(db,"sites",id)
      );

      state.index = state.index.filter(function(s){
        return s.id !== id;
      });

      delete siteCache[id];

      backToList();

      showToast("現場を削除しました");

    }catch(e){

      console.error(e);

      state.error =
        "現場の削除に失敗しました。";

      render();
    }
  }

  /* =========================
     写真
     ========================= */

  function compressImage(file){

    return new Promise(function(resolve,reject){

      var reader = new FileReader();

      reader.onerror = function(){
        reject(new Error("read failed"));
      };

      reader.onload = function(){

        var img = new Image();

        img.onerror = function(){
          reject(new Error("decode failed"));
        };

        img.onload = function(){

          var maxDim = 900;

          var w = img.width;
          var h = img.height;

          if(w > h && w > maxDim){

            h = Math.round(h * maxDim / w);
            w = maxDim;

          }else if(h >= w && h > maxDim){

            w = Math.round(w * maxDim / h);
            h = maxDim;
          }

          var canvas = document.createElement("canvas");

          canvas.width = w;
          canvas.height = h;

          var ctx = canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            w,
            h
          );

          /*
            Firestoreの容量を抑えるため
            900px / JPEG 0.55
          */

          var dataUrl =
            canvas.toDataURL(
              "image/jpeg",
              0.55
            );

          resolve(dataUrl);
        };

        img.src = reader.result;
      };

      reader.readAsDataURL(file);
    });
  }

  async function addPhotos(fileList){

    if(!fileList || !fileList.length){
      return;
    }

    if(!state.currentSite){
      return;
    }

    state.savingPhoto = true;
    render();

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var newPhotos =
        (state.currentSite.photos || []).slice();

      for(var i=0;i<fileList.length;i++){

        try{

          var dataUrl =
            await compressImage(fileList[i]);

          /*
            1枚の写真を独立したオブジェクトとして保存。
          */

          newPhotos.push({
            id:uid(),
            dataUrl:dataUrl,
            addedAt:Date.now()
          });

        }catch(e){

          console.error("photo error",e);
        }
      }

      var ref =
        f.doc(db,"sites",state.currentId);

      await f.updateDoc(ref,{
        photos:newPhotos
      });

      var updated =
        Object.assign({},state.currentSite,{
          photos:newPhotos
        });

      state.currentSite = updated;
      siteCache[state.currentId] = updated;

      state.savingPhoto = false;

      render();

      showToast("写真を追加しました");

    }catch(e){

      console.error(e);

      state.savingPhoto = false;

      state.error =
        "写真の保存に失敗しました。写真の容量が大きすぎる可能性があります。";

      render();
    }
  }

  async function deletePhoto(photoId){

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var newPhotos =
        (state.currentSite.photos || [])
        .filter(function(p){
          return p.id !== photoId;
        });

      var ref =
        f.doc(db,"sites",state.currentId);

      await f.updateDoc(ref,{
        photos:newPhotos
      });

      var updated =
        Object.assign({},state.currentSite,{
          photos:newPhotos
        });

      state.currentSite = updated;
      siteCache[state.currentId] = updated;

      state.lightboxPhotoId = null;

      render();

      showToast("写真を削除しました");

    }catch(e){

      console.error(e);

      state.error =
        "写真の削除に失敗しました。";

      render();
    }
  }

  /* =========================
     コメント
     ========================= */

  async function addComment(text){

    if(!text || !text.trim()){
      return;
    }

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var newComment = {
        id:uid(),
        text:text.trim(),
        createdAt:Date.now()
      };

      var newComments =
        (state.currentSite.comments || [])
        .concat([newComment]);

      var ref =
        f.doc(db,"sites",state.currentId);

      await f.updateDoc(ref,{
        comments:newComments
      });

      var updated =
        Object.assign({},state.currentSite,{
          comments:newComments
        });

      state.currentSite = updated;
      siteCache[state.currentId] = updated;

      render();

      showToast("コメントを追加しました");

    }catch(e){

      console.error(e);

      state.error =
        "コメントの保存に失敗しました。";

      render();
    }
  }

    try{

      await waitForFirebase();

      var db = window.firebaseDB;

        (state.currentSite.comments || [])

          return c.id !== commentId;

      });

        });

  async function resetAll(){

    if(!confirm(
      "すべての現場と写真を削除します。\nこの操作は取り消せません。\n\n本当に削除しますか？"
    )){
      return;
    }

    try{

      await waitForFirebase();

      var db = window.firebaseDB;
      var f = window.firebaseFns;

      var snapshot =
        await f.getDocs(
          f.collection(db,"sites")
        );

      var deletes = [];

      snapshot.forEach(function(d){
        deletes.push(
          f.deleteDoc(
            f.doc(db,"sites",d.id)
          )
        );
      });

      await Promise.all(deletes);

      siteCache = {};
      state.index = [];

      backToList();

      showToast("すべてのデータを削除しました");

    }catch(e){

      console.error(e);

      state.error =
        "データの削除に失敗しました。";

      render();
    }
  }

  /* =========================
     表示
     ========================= */

  function formatDateTime(ts){

    var d = new Date(ts);

    var pad = function(n){
      return n < 10 ? "0" + n : "" + n;
    };

    return (
      (d.getMonth()+1) +
      "/" +
      d.getDate() +
      " " +
      pad(d.getHours()) +
      ":" +
      pad(d.getMinutes())
    );
  }

  function mapUrl(name,address){

    var q =
      (address && address.trim())
      ? address
      : name;

    return (
      "https://maps.google.com/maps?q=" +
      encodeURIComponent(q) +
      "&z=15&output=embed"
    );
  }

  function craneIcon(){

    return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M3 20h6" stroke="#F0B429" stroke-width="1.6" stroke-linecap="round"/>' +
      '<path d="M6 20V6l12 4" stroke="#F0B429" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M18 10v3" stroke="#F0B429" stroke-width="1.6" stroke-linecap="round"/>' +
      '<circle cx="18" cy="14.4" r="1.4" fill="#F0B429"/>' +
      '</svg>';
  }

  function render(){

    var html = "";

    html +=
      '<header class="top">' +
      '<div class="top-inner">' +
      craneIcon() +
      '<div>' +
      '<h1>ニシオ現場写真台帳</h1>' +
      '<div class="sub">Firebaseで全社員共有・現場ごとに地図と写真を記録</div>' +
      '</div>' +
      '</div>' +
      '<div class="hazard-bar"></div>' +
      '</header>';

    html += '<main>';

    if(state.error){

      html +=
        '<div class="banner">' +
        '<span>' +
        escapeHtml(state.error) +
        '</span>' +
        '<button data-action="dismiss-error">閉じる</button>' +
        '</div>';
    }

    if(state.loading){

      html +=
        '<div class="loading-screen">' +
        '読み込み中...' +
        '</div>';

    }else if(state.view === "list"){

      html += renderList();

    }else if(state.view === "detail"){

      html += renderDetail();
    }

    html += '</main>';

    if(
      state.view === "list" &&
      !state.loading
    ){

      html +=
        '<button class="fab" data-action="open-add">+</button>';
    }

    if(state.showAddModal){
      html += renderAddModal();
    }

    if(state.showEditAddr){
      html += renderEditAddrModal();
    }

    if(state.lightboxPhotoId){
      html += renderLightbox();
    }

    if(state.toast){

      html +=
        '<div class="toast">' +
        escapeHtml(state.toast) +
        '</div>';
    }

    app.innerHTML = html;

    bindEvents();
  }

  function renderList(){

    if(!state.index.length){

      return (
        '<div class="empty-state">' +
        '<p>' +
        'まだ現場が登録されていません。<br>' +
        '右下の「＋」から最初の現場を追加してください。' +
        '</p>' +
        '</div>'
      );
    }

    var sorted =
      state.index
      .slice()
      .sort(function(a,b){
        return b.createdAt - a.createdAt;
      });

    var html = "";

    sorted.forEach(function(s){

      var date =
        new Date(s.createdAt);

      var dateStr =
        date.getFullYear() +
        "/" +
        (date.getMonth()+1) +
        "/" +
        date.getDate();

      html +=
        '<div class="site-card" data-action="open-site" data-id="' +
        escapeHtml(s.id) +
        '">' +

        '<div class="name">' +
        escapeHtml(s.name) +
        '</div>' +

        (
          s.address
          ? '<div class="addr">' +
            escapeHtml(s.address) +
            '</div>'
          : ''
        ) +

        (
          s.client
          ? '<div class="addr">得意先: ' +
            escapeHtml(s.client) +
            '</div>'
          : ''
        ) +

        '<div class="meta">登録日: ' +
        dateStr +
        '</div>' +

        '</div>';
    });

    html +=
      '<button class="reset-link" data-action="reset-all">' +
      'すべてのデータを削除' +
      '</button>';

    return html;
  }

  function renderDetail(){

    var site = state.currentSite;

    if(!site){

      return (
        '<div class="loading-screen">' +
        '読み込み中...' +
        '</div>'
      );
    }

    var html =
      '<div class="back-row">' +
      '<button class="back-btn" data-action="back">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M15 5l-7 7 7 7" stroke="#F0B429" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>' +
      '現場一覧に戻る' +
      '</button>' +
      '</div>';

    html +=
      '<h2 class="detail-title">' +
      escapeHtml(site.name) +
      '</h2>';

    html +=
      '<div class="info-row">' +
      '<span class="label">住所</span>' +
      '<span>' +
      (
        site.address
        ? escapeHtml(site.address)
        : "未登録"
      ) +
      '</span>' +
      '</div>';

    html +=
      '<div class="info-row info-row-last">' +
      '<span class="label">得意先</span>' +
      '<span>' +
      (
        site.client
        ? escapeHtml(site.client)
        : "未登録"
      ) +
      '</span>' +
      '<button class="edit-link" data-action="edit-addr">編集</button>' +
      '</div>';

    html +=
      '<div class="map-frame">' +
      '<iframe src="' +
      mapUrl(site.name,site.address) +
      '" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>' +
      '</div>';

    var comments =
      (site.comments || [])
      .slice()
      .sort(function(a,b){
        return b.createdAt - a.createdAt;
      });

    html +=
      '<div class="section-head">' +
      '<h2>コメント</h2>' +
      '<span class="count">' +
      comments.length +
      '件</span>' +
      '</div>';

    html +=
      '<div class="comment-form">' +
      '<input type="text" id="f-comment" placeholder="例: 朝礼8時、資材搬入は10時から" maxlength="300">' +
      '<button data-action="add-comment">追加</button>' +
      '</div>';

    if(comments.length){

      html += '<div class="comment-list">';

      comments.forEach(function(c){

        html +=
          '<div class="comment-item">' +

          '<div class="body">' +

          '<div class="time">' +
          formatDateTime(c.createdAt) +
          '</div>' +

          '<div class="text">' +
          escapeHtml(c.text) +
          '</div>' +

          '</div>' +

          '<button class="del-c" data-action="delete-comment" data-cid="' +
          escapeHtml(c.id) +
          '">' +
          '削除' +
          '</button>' +

          '</div>';
      });

      html += '</div>';

    }else{

      html +=
        '<div class="comment-empty">' +
        'まだコメントがありません。朝礼の内容や申し送りを記録できます。' +
        '</div>';
    }

    var photos = site.photos || [];

    html +=
      '<div class="section-head">' +
      '<h2>写真</h2>' +
      '<span class="count">' +
      photos.length +
      '枚</span>' +
      '</div>';

    html += '<div class="photo-grid">';

    photos
      .slice()
      .reverse()
      .forEach(function(p){

        html +=
          '<div class="photo-tile" data-action="open-photo" data-pid="' +
          escapeHtml(p.id) +
          '">' +

          '<img src="' +
          p.dataUrl +
          '" alt="">' +

          '</div>';
      });

    html +=
      '<label class="photo-tile add-tile">' +

      (
        state.savingPhoto
        ? '<span>保存中...</span>'
        : '<span class="plus">+</span>' +
          '<span>写真を追加</span>'
      ) +

      '<input type="file" accept="image/*" capture="environment" multiple data-action="file-input">' +

      '</label>';

    html += '</div>';

    html +=
      '<button class="reset-link" data-action="delete-site">' +
      'この現場を削除' +
      '</button>';

    return html;
  }

  function renderAddModal(){

    return (
      '<div class="overlay" data-action="overlay-close" data-target="add">' +

      '<div class="modal" onclick="event.stopPropagation()">' +

      '<h2>現場を追加</h2>' +

      '<div class="field">' +
      '<label for="f-name">現場名</label>' +
      '<input id="f-name" type="text" placeholder="例: ○○ビル新築工事" autofocus>' +
      '</div>' +

      '<div class="field">' +
      '<label for="f-addr">住所（地図表示に使用・任意）</label>' +
      '<input id="f-addr" type="text" placeholder="例: 福岡県福岡市博多区...">' +
      '</div>' +

      '<div class="field">' +
      '<label for="f-client">得意先（任意）</label>' +
      '<input id="f-client" type="text" placeholder="例: ○○建設株式会社">' +
      '</div>' +

      '<div class="modal-actions">' +

      '<button class="btn btn-secondary" data-action="close-add">' +
      'キャンセル' +
      '</button>' +

      '<button class="btn btn-primary" data-action="save-add">' +
      '保存' +
      '</button>' +

      '</div>' +

      '</div>' +
      '</div>'
    );
  }

  function renderEditAddrModal(){

    var site = state.currentSite;

    return (
      '<div class="overlay" data-action="overlay-close" data-target="edit">' +

      '<div class="modal" onclick="event.stopPropagation()">' +

      '<h2>現場情報を編集</h2>' +

      '<div class="field">' +
      '<label for="f-edit-addr">住所</label>' +
      '<input id="f-edit-addr" type="text" value="' +
      escapeHtml(site.address || "") +
      '" autofocus>' +
      '</div>' +

      '<div class="field">' +
      '<label for="f-edit-client">得意先</label>' +
      '<input id="f-edit-client" type="text" value="' +
      escapeHtml(site.client || "") +
      '">' +
      '</div>' +

      '<div class="modal-actions">' +

      '<button class="btn btn-secondary" data-action="close-edit">' +
      'キャンセル' +
      '</button>' +

      '<button class="btn btn-primary" data-action="save-edit">' +
      '保存' +
      '</button>' +

      '</div>' +

      '</div>' +
      '</div>'
    );
  }

  function renderLightbox(){

    var site = state.currentSite;

    var photo =
      (site.photos || [])
      .find(function(p){
        return p.id === state.lightboxPhotoId;
      });

    if(!photo){
      return "";
    }

    return (
      '<div class="lightbox">' +

      '<div class="lightbox-top">' +

      '<button data-action="close-lightbox">' +
      '&larr; 閉じる' +
      '</button>' +

      '<button class="del" data-action="delete-photo" data-pid="' +
      escapeHtml(photo.id) +
      '">' +
      '削除' +
      '</button>' +

      '</div>' +

      '<div class="lightbox-img">' +

      '<img src="' +
      photo.dataUrl +
      '" alt="">' +

      '</div>' +

      '</div>'
    );
  }

  /* =========================
     イベント
     ========================= */

  function bindEvents(){

    var commentInput =
      document.getElementById("f-comment");

    if(commentInput){

      commentInput.addEventListener(
        "keydown",
        function(e){

          if(e.key === "Enter"){

            e.preventDefault();

            var value = commentInput.value;

            commentInput.value = "";

            addComment(value);
          }
        }
      );
    }

    app.querySelectorAll("[data-action]")
      .forEach(function(el){

        var action =
          el.getAttribute("data-action");

        if(action === "file-input"){

          el.addEventListener(
            "change",
            function(e){

              addPhotos(e.target.files);

              e.target.value = "";
            }
          );

          return;
        }

        el.addEventListener(
          "click",
          function(){

            var act =
              this.getAttribute("data-action");

            switch(act){

              case "dismiss-error":

                state.error = null;
                render();

                break;

              case "open-add":

                state.showAddModal = true;
                render();

                break;

              case "close-add":

                state.showAddModal = false;
                render();

                break;

              case "open-site":

                openSite(
                  this.getAttribute("data-id")
                );

                break;

              case "back":

                backToList();

                break;

              case "edit-addr":

                state.showEditAddr = true;
                render();

                break;

              case "close-edit":

                state.showEditAddr = false;
                render();

                break;

              case "reset-all":

                resetAll();

                break;

              case "delete-site":

                deleteSite(
                  state.currentId
                );

                break;

              case "open-photo":

                state.lightboxPhotoId =
                  this.getAttribute("data-pid");

                render();

                break;

              case "close-lightbox":

                state.lightboxPhotoId = null;
                render();

                break;

              case "delete-photo":

                if(confirm("この写真を削除しますか？")){

                  deletePhoto(
                    this.getAttribute("data-pid")
                  );
                }

                break;

              case "add-comment":{

                var input =
                  document.getElementById("f-comment");

                if(input){

                  var value = input.value;

                  input.value = "";

                  addComment(value);
                }

                break;
              }

              case "delete-comment":

                if(confirm("このコメントを削除しますか？")){

                  deleteComment(
                    this.getAttribute("data-cid")
                  );
                }

                break;

              case "overlay-close":

                if(
                  this.getAttribute("data-target") === "add"
                ){

                  state.showAddModal = false;

                }else{

                  state.showEditAddr = false;
                }

                render();

                break;

              case "save-add":{

                var name =
                  document.getElementById("f-name").value.trim();

                var addr =
                  document.getElementById("f-addr").value.trim();

                var client =
                  document.getElementById("f-client").value.trim();

                if(!name){

                  alert("現場名を入力してください");

                  return;
                }

                addSite(
                  name,
                  addr,
                  client
                );

                break;
              }

              case "save-edit":{

                var addr2 =
                  document.getElementById("f-edit-addr").value.trim();

                var client2 =
                  document.getElementById("f-edit-client").value.trim();

                updateSiteInfo(
                  state.currentId,
                  addr2,
                  client2
                );

                break;
              }
            }
          }
        );
      });
  }

  /*
    Firebase読み込み開始
  */

  waitForFirebase().then(function(){

    loadIndex();

  });

})();
</script>
