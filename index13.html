*{

/* =========================================================
   ヘッダー
========================================================= */

========================================================= */

.secondary-button{

.danger-button{

   現場一覧
========================================================= */

.header-field-value-md{

.info-row{

/* =========================================================

function uid(){

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,10)
  );

}


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


function showToast(message){

  const old =
    document.querySelector(".toast");

  if(old){
    old.remove();
  }

  const div =
    document.createElement("div");

  div.className = "toast";

  div.textContent = message;

  document.body.appendChild(div);

  setTimeout(function(){

    div.remove();

  },2500);

}


function mapUrl(name,address){

  const q =
    address && address.trim()
      ? address.trim()
      : name;

  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(q)
  );

}


function mapEmbedUrl(name,address){

  const q =
    address && address.trim()
      ? address.trim()
      : name;

  return (
    "https://maps.google.com/maps?q=" +
    encodeURIComponent(q) +
    "&z=15&output=embed"
  );

}


/* =========================================================
   画像圧縮
========================================================= */

function compressImageBlob(file){

  return new Promise(function(resolve,reject){

    const reader =
      new FileReader();

    reader.onload = function(){

      const img =
        new Image();

      img.onload = function(){

        const maxSize = 1600;

        let width = img.width;
        let height = img.height;

        if(
          width > maxSize ||
          height > maxSize
        ){

          if(width > height){

            height =
              Math.round(
                height * maxSize / width
              );

            width = maxSize;

          }else{

            width =
              Math.round(
                width * maxSize / height
              );

            height = maxSize;

          }

        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(
          function(blob){

            if(!blob){

              reject(
                new Error(
                  "画像の圧縮に失敗しました"
                )
              );

              return;
            }

            resolve(blob);

          },
          "image/jpeg",
          0.82
        );

      };

      img.onerror = function(){

        reject(
          new Error(
            "画像を読み込めませんでした"
          )
        );

      };

      img.src = reader.result;

    };

    reader.onerror = function(){

      reject(
        new Error(
          "画像ファイルを読み込めませんでした"
        )
      );

    };

    reader.readAsDataURL(file);

  });

}


/* =========================================================
   現場一覧取得
========================================================= */

async function loadSites(){

  state.loading = true;
  state.error = null;

  render();

  try{

    const snapshot =
      await getDocs(
        collection(db,"sites")
      );

    const sites = [];

    snapshot.forEach(function(item){

      const data =
        item.data();

      sites.push({

        id:item.id,

        name:data.name || "",

        address:data.address || "",

        client:data.client || "",

        comment:data.comment || "",

        photos:
          Array.isArray(data.photos)
            ? data.photos
            : [],

        createdAt:data.createdAt || null,

        updatedAt:data.updatedAt || null

      });

    });


    sites.sort(function(a,b){

      const at =
        a.updatedAt?.seconds ||
        a.createdAt?.seconds ||
        0;

      const bt =
        b.updatedAt?.seconds ||
        b.createdAt?.seconds ||
        0;

      return bt-at;

    });


    state.sites = sites;

  }catch(error){

    console.error(
      "現場一覧取得エラー:",
      error
    );

    state.error =
      "現場データを取得できませんでした。\n" +
      (error.message || error);

  }finally{

    state.loading = false;

    render();

  }

}


/* =========================================================
   一覧の並び替え(触ったものを一番上に)
========================================================= */

function touchSiteInList(siteId){

  const index =
    state.sites.findIndex(function(site){

      return site.id === siteId;

    });

  if(index < 0){
    return;
  }

  state.sites[index] = {

    ...state.sites[index],

    updatedAt:{
      seconds: Math.floor(Date.now() / 1000)
    }

  };

  state.sites.sort(function(a,b){

    const at =
      a.updatedAt?.seconds ||
      a.createdAt?.seconds ||
      0;

    const bt =
      b.updatedAt?.seconds ||
      b.createdAt?.seconds ||
      0;

    return bt-at;

  });

}


/* =========================================================
   現場1件取得
========================================================= */

async function loadSite(siteId){

  state.loading = true;
  state.error = null;

  render();

  try{

    const snapshot =
      await getDoc(
        doc(db,"sites",siteId)
      );

    if(!snapshot.exists()){

      throw new Error(
        "現場データが見つかりません"
      );

    }

    const data =
      snapshot.data();

    state.currentSite = {

      id:snapshot.id,

      name:data.name || "",

      address:data.address || "",

      client:data.client || "",

      comment:data.comment || "",

      photos:
        Array.isArray(data.photos)
          ? data.photos
          : [],

      createdAt:data.createdAt || null,

      updatedAt:data.updatedAt || null

    };

    state.currentId = siteId;

/* =========================================================
   写真追加
========================================================= */

async function addPhotos(fileList){

  let files =
    Array.from(fileList || []);

  if(!files.length){
    return;
  }

  if(
    !state.currentSite ||
    !state.currentId
  ){

    alert(
      "先に現場を開いてください。"
    );

    return;
  }


  files =
    files.filter(function(file){

      return (
        file &&
        file.type &&
        file.type.startsWith("image/")
      );

    });


  if(!files.length){

    alert(
      "画像ファイルを選択してください。"
    );

    return;
  }


  state.savingPhoto = true;
  state.error = null;

  render();


  const uploadedPaths = [];

  try{

    const siteId =
      state.currentId;

    if(!supabase){

      throw new Error(
        "Supabaseクライアントがありません"
      );

    }


    let newPhotos =
      Array.isArray(
        state.currentSite.photos
      )
        ? [...state.currentSite.photos]
        : [];


    for(
      let i=0;
      i<files.length;
      i++
    ){

      const file =
        files[i];

      console.log(
        "写真アップロード開始:",
        file.name,
        file.size,
        file.type
      );


      const blob =
        await compressImageBlob(file);


      if(!blob){

        throw new Error(
          "画像の圧縮に失敗しました"
        );

      }


      const photoId =
        uid();

      const path =
        "sites/" +
        siteId +
        "/" +
        photoId +
        ".jpg";


      const uploadResult =
        await supabase
          .storage
          .from(SUPABASE_BUCKET)
          .upload(
            path,
            blob,
            {
              contentType:"image/jpeg",
              cacheControl:"3600",
              upsert:false
            }
          );


      console.log(
        "Supabase upload result:",
        uploadResult
      );


      if(uploadResult.error){

        throw new Error(
          "Supabaseアップロード失敗:\n" +
          uploadResult.error.message
        );

      }


      uploadedPaths.push(path);


      const verifyResult =
        await supabase
          .storage
          .from(SUPABASE_BUCKET)
          .download(path);


      console.log(
        "Supabase download verify:",
        verifyResult
      );


      if(verifyResult.error){

        throw new Error(
          "Storageには保存されましたが、確認できませんでした:\n" +
          verifyResult.error.message
        );

      }


      if(!verifyResult.data){

        throw new Error(
          "Storageに写真が存在しません"
        );

      }


      const publicResult =
        supabase
          .storage
          .from(SUPABASE_BUCKET)
          .getPublicUrl(path);


      if(
        !publicResult ||
        !publicResult.data ||
        !publicResult.data.publicUrl
      ){

        throw new Error(
          "Supabaseの公開URL取得に失敗しました"
        );

      }


      const publicUrl =
        publicResult.data.publicUrl;


      newPhotos.push({

        id:photoId,

        url:publicUrl,

        path:path,

        addedAt:Date.now()

      });


      console.log(
        "写真1枚の保存完了:",
        publicUrl
      );

    }


    await updateDoc(
      doc(db,"sites",siteId),
      {
        photos:newPhotos,
        updatedAt:serverTimestamp()
      }
    );


    state.currentSite = {

      ...state.currentSite,

      photos:newPhotos

    };


    const index =
      state.sites.findIndex(
        function(site){

          return site.id === siteId;

        }
      );


    if(index >= 0){

      state.sites[index] = {

        ...state.sites[index],

        photos:newPhotos

      };

    }

    touchSiteInList(siteId);

    state.savingPhoto = false;

    state.error = null;

    render();


    showToast(
      files.length +
      "枚の写真を追加しました"
    );


  }catch(error){

    console.error(
      "写真保存エラー:",
      error
    );


    if(
      uploadedPaths.length &&
      supabase
    ){

      try{

        await supabase
          .storage
          .from(SUPABASE_BUCKET)
          .remove(uploadedPaths);

      }catch(cleanupError){

        console.error(
          "Cleanup error:",
          cleanupError
        );

      }

    }


    state.savingPhoto = false;

    state.error =
      "写真の保存に失敗しました。\n\n" +
      (
        error && error.message
          ? error.message
          : String(error)
      );

    render();

  }

}


/* =========================================================
   写真削除
========================================================= */

async function deletePhoto(photoIndex){

  if(!state.currentSite){
    return;
  }

  const photos =
    Array.isArray(
      state.currentSite.photos
    )
      ? [...state.currentSite.photos]
      : [];


  const photo =
    photos[photoIndex];


  if(!photo){
    return;
  }


  const ok =
    confirm(
      "この写真を削除しますか？"
    );


  if(!ok){
    return;
  }


  state.savingPhoto = true;
  state.error = null;

  render();


  try{

    if(photo.path){

      const result =
        await supabase
          .storage
          .from(SUPABASE_BUCKET)
          .remove([
            photo.path
          ]);


      if(result.error){

        throw new Error(
          "Supabase写真削除失敗:\n" +
          result.error.message
        );

      }

    }


    photos.splice(
      photoIndex,
      1
    );


    await updateDoc(
      doc(db,"sites",state.currentId),
      {
        photos:photos,
        updatedAt:serverTimestamp()
      }
    );


    state.currentSite = {

      ...state.currentSite,

      photos:photos

    };


    const index =
      state.sites.findIndex(
        function(site){

          return site.id === state.currentId;

        }
      );


    if(index >= 0){

      state.sites[index] = {

        ...state.sites[index],

        photos:photos

      };

    }


    showToast(
      "写真を削除しました"
    );


  }catch(error){

    console.error(
      "写真削除エラー:",
      error
    );

    state.error =
      "写真の削除に失敗しました。\n" +
      (
        error.message ||
        error
      );

  }finally{

    state.savingPhoto = false;

    render();

  }

}

  }


  app.innerHTML = html;


  if(state.lightboxUrl){

    app.innerHTML +=
      renderLightbox();

  }

}


/* =========================================================
   イベント
========================================================= */

document.addEventListener(
  "click",
  async function(event){

    const target =
      event.target.closest(
        "[data-action]"
      );


    if(!target){
      return;
    }


    const action =
      target.dataset.action;


    /* 現場追加 */

    if(action === "new-site"){

      state.modal = "new";

      render();

      return;

    }


    /* 現場を開く */

    if(action === "open-site"){

      const id =
        target.dataset.id;

      if(id){

        await openSite(id);

      }

      return;

    }


    /* 一覧へ */

    if(action === "back-list"){

      state.page = "list";

      state.currentId = null;

      state.currentSite = null;

      state.error = null;

      render();

      return;

    }


    /* モーダル閉じる */

    if(action === "close-modal"){

      state.modal = null;

      render();

      return;

    }


    /* 現場登録・編集 */

    if(action === "submit-site"){

      const name =
        document.getElementById(
          "site-name"
        )?.value || "";

      const address =
        document.getElementById(
          "site-address"
        )?.value || "";

      const client =
        document.getElementById(
          "site-client"
        )?.value || "";

      const comment =
        document.getElementById(
          "site-comment"
        )?.value || "";


      if(!name.trim()){

        alert(
          "現場名を入力してください。"
        );

        return;

      }


      const data = {
        name,
        address,
        client,
        comment
      };


      if(
        target.dataset.mode === "edit"
      ){

        await updateSite(data);

      }else{

        await addSite(data);

      }

      return;

    }


    /* 現場編集 */

    if(action === "edit-site"){

      state.modal = "edit";

      render();

      return;

    }


    /* 現場削除 */

    if(action === "delete-site"){

      await deleteSite();

      return;

    }


    /* カメラ */

    if(action === "camera-button"){

      cameraInput.value = "";

      cameraInput.click();

      return;

    }


    /* アルバム */

    if(action === "album-button"){

      albumInput.value = "";

      albumInput.click();

      return;

    }


    /* 写真削除 */

    if(action === "delete-photo"){

      const index =
        Number(
          target.dataset.index
        );

      await deletePhoto(index);

      return;

    }


    /* 写真拡大 */

    if(action === "lightbox"){

      const url =
        target.dataset.url;

      if(url){

        state.lightboxUrl = url;

        render();

      }

      return;

    }


    /* Lightbox閉じる */

    if(action === "close-lightbox"){

      state.lightboxUrl = null;

      render();

      return;

    }


    /* Google Maps */

    if(action === "open-map"){

      if(!state.currentSite){
        return;
      }


      const url =
        mapUrl(
          state.currentSite.name,
          state.currentSite.address
        );


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

      return;

    }


    /* コメント */

    if(action === "save-comment"){

      await saveComment();

      return;

    }

  }
);

/* =========================================================
   検索
   日本語入力（IME）完全対応
========================================================= */

/*
  日本語入力中に render() すると、
  入力欄そのものが作り直されるため、

  ・2文字同時に入る
  ・文字が飛ぶ
  ・変換がおかしくなる
  ・カーソルが移動する

  などの問題が起こることがあります。

  そこで、日本語入力中は render() せず、
  入力が確定したときだけ検索結果を更新します。
*/

let searchComposing = false;


/* 日本語入力開始 */

document.addEventListener(
  "compositionstart",
  function(event){

    if(
      event.target &&
      event.target.id === "search-input"
    ){

      searchComposing = true;

    }

  }
);


/* 日本語入力確定 */

document.addEventListener(
  "compositionend",
  function(event){

    if(
      event.target &&
      event.target.id === "search-input"
    ){

      searchComposing = false;

      state.search =
        event.target.value;

      render();


      /*
        render()で検索欄が作り直されるため、
        フォーカスを戻します。
      */

      const input =
        document.getElementById(
          "search-input"
        );


      if(input){

        input.focus();

        input.setSelectionRange(
          input.value.length,
          input.value.length
        );

      }

    }

  }
);


/* 通常の入力 */

document.addEventListener(
  "input",
  function(event){

    if(
      !event.target ||
      event.target.id !== "search-input"
    ){

      return;

    }


    state.search =
      event.target.value;


    /*
      日本語変換中なら
      ここでは画面を再描画しません。
    */

    if(
      searchComposing ||
      event.isComposing
    ){

      return;

    }


    /*
      英数字など通常入力の場合は
      今まで通り検索結果を更新します。
    */

    render();


    const input =
      document.getElementById(
        "search-input"
      );


    if(input){

      input.focus();

      input.setSelectionRange(
        input.value.length,
        input.value.length
      );

    }

  }
);


/* =========================================================
   ESCキー
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key !== "Escape"){
      return;
    }


    if(state.lightboxUrl){

      state.lightboxUrl = null;

      render();

      return;

    }


    if(state.modal){

      state.modal = null;

      render();

      return;

    }

  }
);

   初期表示
========================================================= */

render();

loadSites();
