<script>

(function(){

"use strict";


/* ==================================================
   Supabase
   ================================================== */

var supabase = null;


function waitForSupabase(){

  return new Promise(function(resolve,reject){

    if(window.supabaseClient){

      supabase =
        window.supabaseClient;

      resolve();

      return;

    }


    var timeout =
      setTimeout(function(){

        clearInterval(timer);

        reject(
          new Error(
            "Supabaseの接続待ちがタイムアウトしました"
          )
        );

      },10000);


    var timer =
      setInterval(function(){

        if(window.supabaseClient){

          clearInterval(timer);

          clearTimeout(timeout);

          supabase =
            window.supabaseClient;

          resolve();

        }

      },50);

  });

}


/* ==================================================
   状態
   ================================================== */

var state = {

  view:"list",

  loading:true,

  error:null,

  index:[],

  currentId:null,

  currentSite:null,

  showAddModal:false,

  showEditAddr:false,

  lightboxPhotoId:null,

  toast:null,

  savingPhoto:false

};


var siteCache = {};

var app =
  document.getElementById("app");


/* ==================================================
   Firebase待機
   ================================================== */

function waitForFirebase(){

  return new Promise(function(resolve){

    if(
      window.firebaseDB &&
      window.firebaseFns
    ){

      resolve();

      return;

    }


    window.addEventListener(
      "firebase-ready",
      function(){

        resolve();

      },
      {once:true}
    );

  });

}


/* ==================================================
   ID
   ================================================== */

function uid(){

  return (

    Date.now().toString(36) +

    Math.random()
      .toString(36)
      .slice(2,10)

  );

}


/* ==================================================
   HTMLエスケープ
   ================================================== */

function escapeHtml(s){

  return String(s || "").replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"

      }[c];

    }
  );

}


/* ==================================================
   Toast
   ================================================== */

function showToast(msg){

  state.toast =
    msg;

  render();


  setTimeout(function(){

    state.toast =
      null;

    render();

  },1800);

}


/* ==================================================
   一覧読み込み
   ================================================== */

async function loadIndex(){

  state.loading =
    true;

  render();


  try{

    await waitForFirebase();


    var db =
      window.firebaseDB;

    var f =
      window.firebaseFns;


    var q =
      f.query(
        f.collection(db,"sites"),
        f.orderBy("createdAt","desc")
      );


    var snapshot =
      await f.getDocs(q);


    var list = [];


    snapshot.forEach(function(d){

      var data =
        d.data();


      list.push({

        id:d.id,

        name:data.name || "",

        address:data.address || "",

        client:data.client || "",

        createdAt:
          data.createdAt ||
          Date.now()

      });

    });


    state.index =
      list;

    state.error =
      null;


  }catch(e){

    console.error(
      "Firebase一覧エラー:",
      e
    );


    state.index =
      [];

    state.error =
      "Firebaseからデータを読み込めませんでした。Firestoreのルールを確認してください。";

  }


  state.loading =
    false;

  render();

}


/* ==================================================
   現場を開く
   ================================================== */

async function openSite(id){

  state.currentId =
    id;

  state.view =
    "detail";


  if(siteCache[id]){

    state.currentSite =
      siteCache[id];

    render();

  }else{

    state.currentSite =
      null;

    render();

  }


  try{

    await waitForFirebase();


    var db =
      window.firebaseDB;

    var f =
      window.firebaseFns;


    var siteRef =
      f.doc(
        db,
        "sites",
        id
      );


    var siteSnap =
      await f.getDoc(siteRef);


    if(!siteSnap.exists()){

      var meta =
        state.index.find(
          function(s){

            return s.id === id;

          }
        );


      state.currentSite =
        meta || {

          id:id,

          name:"",

          address:"",

          client:"",

          photos:[],

          comments:[]

        };


    }else{

      var data =
        siteSnap.data();


      state.currentSite = {

        id:id,

        name:data.name || "",

        address:data.address || "",

        client:data.client || "",

        createdAt:
          data.createdAt ||
          Date.now(),

        photos:
          Array.isArray(data.photos)
            ? data.photos
            : [],

        comments:
          Array.isArray(data.comments)
            ? data.comments
            : []

      };

    }


    siteCache[id] =
      state.currentSite;


    render();


  }catch(e){

    console.error(
      "現場読み込みエラー:",
      e
    );


    state.error =
      "現場データの読み込みに失敗しました。";

    render();

  }

}


/* ==================================================
   一覧へ戻る
   ================================================== */

function backToList(){

  state.view =
    "list";

  state.currentId =
    null;

  state.currentSite =
    null;

  state.lightboxPhotoId =
    null;

  render();

}


/* ==================================================
   現場追加
   ================================================== */

async function addSite(
  name,
  address,
  client
){

  try{

    await waitForFirebase();


    var db =
      window.firebaseDB;

    var f =
      window.firebaseFns;


    var site = {

      name:name,

      address:address,

      client:client,

      createdAt:Date.now(),

      photos:[],

      comments:[]

    };


    var ref =
      await f.addDoc(
        f.collection(db,"sites"),
        site
      );


    state.index.push({

      id:ref.id,

      name:name,

      address:address,

      client:client,

      createdAt:site.createdAt

    });


    siteCache[ref.id] = {

      id:ref.id,

      name:name,

      address:address,

      client:client,

      createdAt:site.createdAt,

      photos:[],

      comments:[]

    };


    state.showAddModal =
      false;


    render();


    openSite(ref.id);


  }catch(e){

    console.error(e);


    state.error =
      "現場の保存に失敗しました。";

    render();

  }

}


/* ==================================================
   現場情報更新
   ================================================== */

async function updateSiteInfo(
  id,
  address,
  client
){

  try{

    await waitForFirebase();


    var db =
      window.firebaseDB;

    var f =
      window.firebaseFns;


    await f.updateDoc(
      f.doc(db,"sites",id),
      {
        address:address,
        client:client
      }
    );


    state.index =
      state.index.map(
        function(s){

          if(s.id !== id){

            return s;

          }


          return Object.assign(
            {},
            s,
            {
              address:address,
              client:client
            }
          );

        }
      );


    var updated =
      Object.assign(
        {},
        state.currentSite,
        {
          address:address,
          client:client
        }
      );


    state.currentSite =
      updated;

    siteCache[id] =
      updated;


    state.showEditAddr =
      false;


    render();


    showToast(
      "現場情報を更新しました"
    );


  }catch(e){

    console.error(e);

    state.error =
      "現場情報の更新に失敗しました。";

    render();

  }

}


/* ==================================================
   Supabase写真削除
   ================================================== */

async function removeSupabasePhotos(
  photos
){

  await waitForSupabase();


  if(!photos || !photos.length){

    return;

  }


  var paths =
    photos
      .filter(function(p){

        return p &&
               p.path;

      })
      .map(function(p){

        return p.path;

      });


  if(!paths.length){

    return;

  }

/* ==================================================
   画像圧縮
   ================================================== */

function compressImageBlob(file){

  return new Promise(
    function(resolve,reject){

      if(!file){

        reject(
          new Error(
            "ファイルがありません"
          )
        );

        return;

      }


      var reader =
        new FileReader();


      reader.onerror =
        function(){

          reject(
            new Error(
              "画像読み込みに失敗しました"
            )
          );

        };


      reader.onload =
        function(){

          var img =
            new Image();


          img.onerror =
            function(){

              reject(
                new Error(
                  "画像の読み込みに失敗しました"
                )
              );

            };


          img.onload =
            function(){

              var maxDim =
                1200;


              var w =
                img.naturalWidth ||
                img.width;


              var h =
                img.naturalHeight ||
                img.height;


              if(!w || !h){

                reject(
                  new Error(
                    "画像サイズを取得できませんでした"
                  )
                );

                return;

              }


              if(
                w > maxDim ||
                h > maxDim
              ){

                if(w >= h){

                  h =
                    Math.round(
                      h * maxDim / w
                    );

                  w =
                    maxDim;

                }else{

                  w =
                    Math.round(
                      w * maxDim / h
                    );

                  h =
                    maxDim;

                }

              }


              var canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                w;

              canvas.height =
                h;


              var ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                w,
                h
              );


              canvas.toBlob(
                function(blob){

                  if(!blob){

                    reject(
                      new Error(
                        "画像圧縮に失敗しました"
                      )
                    );

                    return;

                  }


                  resolve(blob);

                },
                "image/jpeg",
                0.70
              );

            };


          img.src =
            reader.result;

        };


      reader.readAsDataURL(file);

    }
  );

}


/* ==================================================
   写真追加
   ================================================== */

async function addPhotos(fileList){

  if(
    !fileList ||
    !fileList.length
  ){

    return;

  }


  if(!state.currentSite){

    alert(
      "現場を開いてから写真を追加してください。"
    );

    return;

  }


  state.savingPhoto =
    true;

  state.error =
    null;

  render();


  var uploadedPaths =
    [];


  try{

    await waitForFirebase();

    await waitForSupabase();


    var db =
      window.firebaseDB;

    var f =
      window.firebaseFns;


    var siteId =
      state.currentId;


    var newPhotos =
      (
        state.currentSite.photos ||
        []
      ).slice();


    for(
      var i=0;
      i<fileList.length;
      i++
    ){

      var file =
        fileList[i];


      if(
        !file.type ||
        !file.type.startsWith("image/")
      ){

        continue;

      }


      /*
        画像圧縮
      */

      var blob =
        await compressImageBlob(
          file
        );


      /*
        写真ID
      */

      var photoId =
        uid();


      /*
        Supabase保存先
      */

      var path =
        "sites/" +
        siteId +
        "/" +
        photoId +
        ".jpg";


      console.log(
        "Supabaseアップロード:",
        path
      );


      /*
        Supabaseへアップロード
      */

      var uploadResult =
        await supabase
          .storage
          .from("photos")
          .upload(
            path,
            blob,
            {
              contentType:"image/jpeg",
              cacheControl:"3600",
              upsert:false
            }
          );


      if(uploadResult.error){

        console.error(
          "Supabase upload error:",
          uploadResult.error
        );

        throw uploadResult.error;

      }


      uploadedPaths.push(
        path
      );


      /*
        公開URL
      */

      var publicResult =
        supabase
          .storage
          .from("photos")
          .getPublicUrl(
            path
          );


      if(
        !publicResult ||
        !publicResult.data ||
        !publicResult.data.publicUrl
      ){

        throw new Error(
          "Supabaseの公開URL取得に失敗しました"
        );

      }


      var photoUrl =
        publicResult
          .data
          .publicUrl;


      console.log(
        "写真URL:",
        photoUrl
      );


      /*
        Firestoreには
        URLとStorageパスだけ保存
      */

      newPhotos.push({

        id:photoId,

        url:photoUrl,

        path:path,

        addedAt:Date.now()

      });

    }


    /*
      Firestoreへ保存
    */

    var ref =
      f.doc(
        db,
        "sites",
        siteId
      );


    await f.updateDoc(
      ref,
      {
        photos:newPhotos
      }
    );


    /*
      ローカル状態更新
    */

    var updated =
      Object.assign(
        {},
        state.currentSite,
        {
          photos:newPhotos
        }
      );


    state.currentSite =
      updated;


    siteCache[siteId] =
      updated;


    state.savingPhoto =
      false;


    render();


    showToast(
      fileList.length +
      "枚の写真を追加しました"
    );


  }catch(e){

    console.error(
      "写真保存エラー:",
      e
    );


    /*
      途中までアップロードした
      写真を削除
    */

    if(uploadedPaths.length){

      try{

        await supabase
          .storage
          .from("photos")
          .remove(
            uploadedPaths
          );

      }catch(cleanupError){

        console.error(
          "写真後処理エラー:",
          cleanupError
        );

      }

    }


    state.savingPhoto =
      false;


    state.error =
      "写真の保存に失敗しました。Supabase Storageの設定を確認してください。";


    render();

  }

}


/* ==================================================
   写真削除
   ================================================== */

async function deletePhoto(
  photoId
){

  try{

    await waitForFirebase();

    await waitForSupabase();


    var db =
      window.firebaseDB;

    var f =
      window.firebaseFns;


    var photos =
      state.currentSite.photos ||
      [];


    var target =
      photos.find(
        function(p){

          return p.id === photoId;

        }
      );


    /*
      Supabaseから削除
    */

    if(
      target &&
      target.path
    ){

      var removeResult =
        await supabase
          .storage
          .from("photos")
          .remove([
            target.path
          ]);


      if(removeResult.error){

        throw removeResult.error;

      }

    }


    /*
      FirestoreからURL情報を削除
    */

    var newPhotos =
      photos.filter(
        function(p){

          return p.id !== photoId;

        }
      );


    await f.updateDoc(
      f.doc(
        db,
        "sites",
        state.currentId
      ),
      {
        photos:newPhotos
      }
    );


    state.currentSite =
      Object.assign(
        {},
        state.currentSite,
        {
          photos:newPhotos
        }
      );


    siteCache[
      state.currentId
    ] =
      state.currentSite;


    state.lightboxPhotoId =
      null;


    render();


    showToast(
      "写真を削除しました"
    );

    console.error(
      "写真削除エラー:",
      e
    );


    state.error =
      "写真の削除に失敗しました。";

    render();

  }

}

/* ==================================================
   全削除
   ================================================== */

async function resetAll(){

  if(!confirm(
    "すべての現場と写真を削除します。\nこの操作は取り消せません。\n\n本当に削除しますか？"
  )){

    return;

  }


  try{

    await waitForFirebase();

    await waitForSupabase();


    var db =
      window.firebaseDB;

    var f =
      window.firebaseFns;


    var snapshot =
      await f.getDocs(
        f.collection(db,"sites")
      );


    /*
      全写真のパスを取得
    */

    var allPaths = [];


    snapshot.forEach(
      function(d){

        var data =
          d.data();


        var photos =
          data.photos || [];


        photos.forEach(
          function(p){

            if(p && p.path){

              allPaths.push(
                p.path
              );

            }

          }
        );

      }
    );


    /*
      Supabase写真削除
    */

    if(allPaths.length){

      var result =
        await supabase
          .storage
          .from("photos")
          .remove(
            allPaths
          );


      if(result.error){

        console.error(
          "Storage全削除エラー:",
          result.error
        );

      }

    }


    /*
      Firestore削除
    */

    var promises = [];


    snapshot.forEach(
      function(d){

        promises.push(
          f.deleteDoc(
            f.doc(
              db,
              "sites",
              d.id
            )
          )
        );

      }
    );


    await Promise.all(
      promises
    );


    siteCache =
      {};

    state.index =
      [];

    state.currentId =
      null;

    state.currentSite =
      null;

    state.view =
      "list";


    render();


    showToast(
      "すべてのデータを削除しました"
    );


  }catch(e){

    console.error(e);


    state.error =
      "データの削除に失敗しました。";

    render();

  }

}


/* ==================================================
   日時
   ================================================== */

function formatDateTime(ts){

  var d =
    new Date(ts);


  var pad =
    function(n){

      return n < 10
        ? "0" + n
        : "" + n;

    };


  return (

    (d.getMonth()+1) +
    "/" +
    d.getDate() +
    " " +
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes())

  );

}


/* ==================================================
   Googleマップ
   ================================================== */

function mapUrl(
  name,
  address
){

  var q =
    address &&
    address.trim()
      ? address
      : name;


  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(q)
  );

}

            '<button class="photo-add-button" data-action="album-button">' +

              '🖼️ アルバムから選択' +

            '</button>' +

          '</>'

      ) +


      /*
        カメラ用
      */

      '<input id="camera-input" type="file" accept="image/*" capture="environment" multiple>' +


      /*
        アルバム用
      */

      '<input id="album-input" type="file" accept="image/*" multiple>' +


    '</div>';


  html +=
    '</div>';


  html +=

    '<button class="reset-link" data-action="delete-site">' +

      'この現場を削除' +

    '</button>';


  return html;

}

/* ==================================================
   写真拡大
   ================================================== */

function renderLightbox(){

  var site =
    state.currentSite;


  var photo =
    (site.photos || [])
      .find(
        function(p){

          return p.id ===
            state.lightboxPhotoId;

        }
      );


  if(!photo){

    return "";

  }


  var src =
    photo.url ||
    photo.dataUrl ||
    "";


  return (

    '<div class="lightbox">' +

      '<div class="lightbox-top">' +

        '<button data-action="close-lightbox">' +

          '← 閉じる' +

        '</button>' +

        '<button class="del" data-action="delete-photo" data-pid="' +

          escapeHtml(photo.id) +

        '">' +

          '削除' +

        '</button>' +

      '</div>' +

      '<div class="lightbox-img">' +

        '<img src="' +

          escapeHtml(src) +

        '" alt="現場写真">' +

      '</div>' +

    '</div>'

  );

}


/* ==================================================
   イベント
   ================================================== */

function bindEvents(){

  /*
    コメントEnter
  */

  var commentInput =
    document.getElementById(
      "f-comment"
    );


  if(commentInput){

    commentInput.addEventListener(
      "keydown",
      function(e){

        if(e.key === "Enter"){

          e.preventDefault();


          var value =
            commentInput.value;


          commentInput.value =
            "";


          addComment(value);

        }

      }
    );

  }


  /*
    カメラ
  */

  var cameraInput =
    document.getElementById(
      "camera-input"
    );


  if(cameraInput){

    cameraInput.addEventListener(
      "change",
      function(e){

        addPhotos(
          e.target.files
        );


        e.target.value =
          "";

      }
    );

  }


  /*
    アルバム
  */

  var albumInput =
    document.getElementById(
      "album-input"
    );


  if(albumInput){

    albumInput.addEventListener(
      "change",
      function(e){

        addPhotos(
          e.target.files
        );


        e.target.value =
          "";

      }
    );

  }


  /*
    data-action
  */

  app.querySelectorAll(
    "[data-action]"
  )
  .forEach(
    function(el){

      var action =
        el.getAttribute(
          "data-action"
        );


      el.addEventListener(
        "click",
        function(e){

          var act =
            this.getAttribute(
              "data-action"
            );


          switch(act){

            case "dismiss-error":

              state.error =
                null;

              render();

              break;


            case "open-add":

              state.showAddModal =
                true;

              render();

              break;


            case "close-add":

              state.showAddModal =
                false;

              render();

              break;


            case "open-site":

              openSite(
                this.getAttribute(
                  "data-id"
                )
              );

              break;


            case "back":

              backToList();

              break;


            case "edit-addr":

              state.showEditAddr =
                true;

              render();

              break;


            case "close-edit":

              state.showEditAddr =
                false;

              render();

              break;


            case "camera-button":{

              e.preventDefault();

              var cam =
                document.getElementById(
                  "camera-input"
                );

              if(cam){

                cam.click();

              }

              break;

            }


            case "album-button":{

              e.preventDefault();

              var alb =
                document.getElementById(
                  "album-input"
                );

              if(alb){

                alb.click();

              }

              break;

            }


            case "open-photo":

              state.lightboxPhotoId =
                this.getAttribute(
                  "data-pid"
                );

              render();

              break;


            case "close-lightbox":

              state.lightboxPhotoId =
                null;

              render();

              break;


            case "delete-photo":

              if(confirm(
                "この写真を削除しますか？"
              )){

                deletePhoto(
                  this.getAttribute(
                    "data-pid"
                  )
                );

              }

              break;


            case "delete-site":

              deleteSite(
                state.currentId
              );

              break;


            case "reset-all":

              resetAll();

              break;


            case "add-comment":{

              var input =
                document.getElementById(
                  "f-comment"
                );


              if(input){

                var value =
                  input.value;


                input.value =
                  "";


                addComment(value);

              }

              break;

            }


            case "delete-comment":

              if(confirm(
                "このコメントを削除しますか？"
              )){

                deleteComment(
                  this.getAttribute(
                    "data-cid"
                  )
                );

              }

              break;


            case "overlay-close":

              if(
                this.getAttribute(
                  "data-target"
                ) === "add"
              ){

                state.showAddModal =
                  false;

              }else{

                state.showEditAddr =
                  false;

              }


              render();

              break;


            case "save-add":{

              var nameEl =
                document.getElementById(
                  "f-name"
                );


              var addrEl =
                document.getElementById(
                  "f-addr"
                );


              var clientEl =
                document.getElementById(
                  "f-client"
                );


              var name =
                nameEl
                  ? nameEl.value.trim()
                  : "";


              var addr =
                addrEl
                  ? addrEl.value.trim()
                  : "";


              var client =
                clientEl
                  ? clientEl.value.trim()
                  : "";


              if(!name){

                alert(
                  "現場名を入力してください"
                );

                return;

              }


              addSite(
                name,
                addr,
                client
              );


              break;

            }


            case "save-edit":{

              var addr2El =
                document.getElementById(
                  "f-edit-addr"
                );


              var client2El =
                document.getElementById(
                  "f-edit-client"
                );


              var addr2 =
                addr2El
                  ? addr2El.value.trim()
                  : "";


              var client2 =
                client2El
                  ? client2El.value.trim()
                  : "";


              updateSiteInfo(
                state.currentId,
                addr2,
                client2
              );


              break;

            }

          }

        }
      );

    }
  );

}


/* ==================================================
   起動
   ================================================== */

waitForFirebase()
  .then(
    function(){

      loadIndex();

    }
  )
  .catch(
    function(e){

      console.error(e);

      state.loading =
        false;

      state.error =
        "Firebaseの起動に失敗しました。";

      render();

    }
  );


})();
